<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">MCP Events bridge overview</title>
  <desc id="desc">Services such as Resend, GitHub and others send webhooks to Hookdeck Event Gateway, which receives and verifies them, builds an MCP Event for each subscription and filters it, then signs and delivers it, with retries, to agents such as ChatGPT, Hermes Agent and others. The agents subscribe over MCP to the MCP Events bridge, which creates one Event Gateway connection per subscription. Claude Code polls the bridge over MCP instead.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .accent { fill: #eef1ff; stroke: #5b6bf0; }
    .dashed { stroke-dasharray: 6 5; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .label { fill: #59636e; font-size: 13px; }
    .arrow { stroke: #59636e; fill: none; stroke-width: 1.6; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .accent { fill: #1c2140; stroke: #7c8cff; }
      .text { fill: #e6edf3; }
      .muted, .label { fill: #9198a1; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="1198" height="338" rx="14"/>

  <!-- Services -->
  <text class="muted" x="40" y="168" font-size="13" font-weight="600" letter-spacing="0.5">SERVICES</text>
  <rect class="box" x="30" y="180" width="170" height="40" rx="8"/>
  <text class="text" x="115" y="205" font-size="15" text-anchor="middle">Resend</text>
  <rect class="box" x="30" y="230" width="170" height="40" rx="8"/>
  <text class="text" x="115" y="255" font-size="15" text-anchor="middle">GitHub</text>
  <rect class="box dashed" x="30" y="280" width="170" height="40" rx="8"/>
  <text class="text" x="115" y="305" font-size="14" text-anchor="middle">other services</text>

  <!-- Event Gateway: receives, builds and delivers each event -->
  <rect class="panel" x="250" y="170" width="660" height="150" rx="12"/>
  <text class="text" x="580" y="304" font-size="15" font-weight="600" text-anchor="middle">Hookdeck Event Gateway</text>
  <rect class="box" x="268" y="200" width="180" height="60" rx="8"/>
  <text class="text" x="358" y="226" font-size="15" text-anchor="middle">receive · verify</text>
  <text class="muted" x="358" y="246" font-size="12" text-anchor="middle">every request kept</text>
  <rect class="box" x="480" y="200" width="180" height="60" rx="8"/>
  <text class="text" x="570" y="226" font-size="15" text-anchor="middle">MCP Event · filter</text>
  <text class="muted" x="570" y="246" font-size="12" text-anchor="middle">per subscription</text>
  <rect class="box" x="692" y="200" width="180" height="60" rx="8"/>
  <text class="text" x="782" y="226" font-size="15" text-anchor="middle">sign · deliver · retry</text>
  <text class="muted" x="782" y="246" font-size="12" text-anchor="middle">per subscriber</text>
  <path class="arrow" d="M448,230 H478" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M660,230 H690" marker-end="url(#arrowhead)"/>

  <path class="arrow" d="M200,200 C240,200 240,228 266,228" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M200,250 C240,250 240,232 266,232" marker-end="url(#arrowhead)"/>
  <path class="arrow dashed" d="M200,300 C240,300 240,238 266,238" marker-end="url(#arrowhead)"/>

  <!-- Bridge: the MCP server, out of the data path -->
  <rect class="accent" x="470" y="40" width="220" height="80" rx="10" stroke-width="1.6"/>
  <text class="text" x="580" y="74" font-size="17" font-weight="600" text-anchor="middle">MCP Events bridge</text>
  <text class="muted" x="580" y="98" font-size="14" text-anchor="middle">catalog · subscriptions</text>
  <path class="arrow dashed" d="M570,122 V198" marker-end="url(#arrowhead)"/>
  <text class="label" x="582" y="164">a connection per subscription</text>

  <!-- Agents: a stack, front to back, each card a little narrower and overlapping the top of the one behind it -->
  <text class="muted" x="955" y="168" font-size="13" font-weight="600" letter-spacing="0.5">AGENTS</text>
  <rect class="box dashed" x="968" y="270" width="184" height="44" rx="8"/>
  <text class="text" x="1060" y="302" font-size="17" text-anchor="middle">…</text>
  <rect class="box" x="962" y="240" width="196" height="44" rx="8"/>
  <text class="text" x="1060" y="274" font-size="15" text-anchor="middle">Claude Code <tspan class="muted" font-size="12">· polls</tspan></text>
  <rect class="box" x="956" y="210" width="208" height="44" rx="8"/>
  <text class="text" x="1060" y="244" font-size="15" text-anchor="middle">Hermes Agent</text>
  <rect class="box" x="950" y="180" width="220" height="44" rx="8"/>
  <text class="text" x="1060" y="207" font-size="15" text-anchor="middle">ChatGPT</text>
  <path class="arrow" d="M872,222 C910,222 920,202 948,202" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M872,230 C910,230 925,239 954,239" marker-end="url(#arrowhead)"/>
  <path class="arrow dashed" d="M872,238 C910,238 930,299 966,299" marker-end="url(#arrowhead)"/>

  <!-- Subscribe over MCP -->
  <path class="arrow" d="M1120,178 V88 Q1120,80 1112,80 H692" marker-end="url(#arrowhead)"/>
  <text class="label" x="900" y="72" text-anchor="middle">subscribe over MCP</text>
</svg>
