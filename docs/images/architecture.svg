<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">MCP Events bridge architecture</title>
  <desc id="desc">Services such as Resend, GitHub and others send webhooks to Hookdeck Event Gateway sources, which verify and keep them. Agents such as ChatGPT, Hermes Agent (through the Hookdeck CLI) and others subscribe to the MCP Events bridge over MCP, and the bridge creates one Event Gateway connection per subscription on the service's source. Each connection turns a webhook into an MCP Event, filters it by the subscription's arguments, dedupes and retries, and its destination delivers it to the agent's callback URL, signing every attempt with the subscriber's secret. Event Gateway's issue notifications tell the bridge about failing callbacks. Claude Code polls the bridge over MCP instead.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .accent { fill: #eef1ff; stroke: #5b6bf0; }
    .dashed { stroke-dasharray: 6 5; }
    .dotted { stroke-dasharray: 2 4; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .label { fill: #59636e; font-size: 13px; }
    .arrow { stroke: #59636e; fill: none; stroke-width: 1.6; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .accent { fill: #1c2140; stroke: #7c8cff; }
      .text { fill: #e6edf3; }
      .muted, .label { fill: #9198a1; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="1198" height="598" rx="14"/>

  <g transform="translate(0,120)">
    <!-- Bridge: the MCP server, out of the data path -->
    <rect class="accent" x="505" y="-100" width="250" height="72" rx="10" stroke-width="1.6"/>
    <text class="text" x="630" y="-70" font-size="17" font-weight="600" text-anchor="middle">MCP Events bridge</text>
    <text class="muted" x="630" y="-47" font-size="13" text-anchor="middle">catalog · subscriptions · challenge</text>
    <path class="arrow dashed" d="M630,-26 V96" marker-end="url(#arrowhead)"/>
    <text class="label" x="642" y="12">creates a connection per subscription</text>
    <path class="arrow dotted" d="M560,38 V-24" marker-end="url(#arrowhead)"/>
    <text class="label" x="548" y="12" text-anchor="end">issue notifications</text>

    <!-- Services -->
    <text class="muted" x="40" y="62" font-size="13" font-weight="600" letter-spacing="0.5">SERVICES</text>
    <rect class="box" x="30" y="100" width="170" height="50" rx="8"/>
    <text class="text" x="115" y="130" font-size="16" text-anchor="middle">Resend</text>
    <rect class="box" x="30" y="190" width="170" height="50" rx="8"/>
    <text class="text" x="115" y="220" font-size="16" text-anchor="middle">GitHub</text>
    <rect class="box dashed" x="30" y="280" width="170" height="62" rx="8"/>
    <text class="text" x="115" y="306" font-size="14" text-anchor="middle">Stripe, Shopify, Linear…</text>
    <text class="muted" x="115" y="326" font-size="13" text-anchor="middle">other services</text>

    <!-- Event Gateway -->
    <rect class="panel" x="240" y="40" width="775" height="340" rx="12"/>
    <text class="text" x="627" y="366" font-size="15" font-weight="600" text-anchor="middle">Hookdeck Event Gateway</text>

    <rect class="box" x="260" y="100" width="190" height="50" rx="8"/>
    <text class="text" x="355" y="130" font-size="15" text-anchor="middle">Resend source</text>
    <rect class="box" x="260" y="190" width="190" height="50" rx="8"/>
    <text class="text" x="355" y="220" font-size="15" text-anchor="middle">GitHub source</text>
    <rect class="box dashed" x="260" y="285" width="190" height="52" rx="8"/>
    <text class="text" x="355" y="309" font-size="15" text-anchor="middle">a source per service</text>
    <text class="muted" x="355" y="327" font-size="12" text-anchor="middle">verify · keep every request</text>

    <path class="arrow" d="M200,125 H258" marker-end="url(#arrowhead)"/>
    <path class="arrow" d="M200,215 H258" marker-end="url(#arrowhead)"/>
    <path class="arrow dashed" d="M200,311 H258" marker-end="url(#arrowhead)"/>

    <!-- A connection per subscription: a stack -->
    <rect class="box" x="532" y="112" width="240" height="225" rx="8"/>
    <rect class="box" x="526" y="106" width="240" height="225" rx="8"/>
    <rect class="box" x="520" y="100" width="240" height="225" rx="8"/>
    <text class="text" x="640" y="132" font-size="15" font-weight="600" text-anchor="middle">connection per subscription</text>
    <text class="muted" x="640" y="152" font-size="12" text-anchor="middle">on its service's source</text>
    <text class="text" x="640" y="192" font-size="14" text-anchor="middle">transform → MCP Event</text>
    <text class="text" x="640" y="222" font-size="14" text-anchor="middle">filter by its arguments</text>
    <text class="text" x="640" y="252" font-size="14" text-anchor="middle">dedupe · retry</text>
    <text class="muted" x="640" y="290" font-size="12" text-anchor="middle">the transformation is generated</text>
    <text class="muted" x="640" y="306" font-size="12" text-anchor="middle">by the bridge, one per source</text>

    <path class="arrow" d="M450,125 C485,125 485,180 518,180" marker-end="url(#arrowhead)"/>
    <path class="arrow" d="M450,215 C485,215 485,212 518,212" marker-end="url(#arrowhead)"/>
    <path class="arrow dashed" d="M450,311 C485,311 485,244 518,244" marker-end="url(#arrowhead)"/>

    <!-- Destination per subscription -->
    <rect class="box" x="810" y="150" width="180" height="140" rx="8"/>
    <text class="text" x="900" y="180" font-size="15" font-weight="600" text-anchor="middle">destination</text>
    <text class="muted" x="900" y="198" font-size="12" text-anchor="middle">per subscription</text>
    <text class="text" x="900" y="232" font-size="14" text-anchor="middle">the callback URL</text>
    <text class="muted" x="900" y="256" font-size="12" text-anchor="middle">signs every attempt with</text>
    <text class="muted" x="900" y="272" font-size="12" text-anchor="middle">the subscriber's secret</text>
    <path class="arrow" d="M772,220 H808" marker-end="url(#arrowhead)"/>

    <!-- Agents: subscribe over MCP, receive deliveries. A stack, front to back, each card a little narrower and
         overlapping the top of the one behind it -->
    <rect class="panel" x="1035" y="40" width="150" height="340" rx="12"/>
    <text class="text" x="1110" y="66" font-size="15" font-weight="600" text-anchor="middle">Agents</text>
    <text class="muted" x="1110" y="86" font-size="13" text-anchor="middle">subscribe · receive</text>
    <rect class="box dashed" x="1057" y="276" width="106" height="50" rx="8"/>
    <text class="text" x="1110" y="313" font-size="17" text-anchor="middle">…</text>
    <rect class="box" x="1053" y="226" width="114" height="64" rx="8"/>
    <text class="text" x="1110" y="261" font-size="15" text-anchor="middle">Claude Code</text>
    <text class="muted" x="1110" y="279" font-size="12" text-anchor="middle">polls over MCP</text>
    <rect class="box" x="1049" y="176" width="122" height="64" rx="8"/>
    <text class="text" x="1110" y="211" font-size="15" text-anchor="middle">Hermes Agent</text>
    <text class="muted" x="1110" y="229" font-size="12" text-anchor="middle">via Hookdeck CLI</text>
    <rect class="box" x="1045" y="140" width="130" height="50" rx="8"/>
    <text class="text" x="1110" y="170" font-size="15" text-anchor="middle">ChatGPT</text>
    <path class="arrow" d="M990,200 C1018,200 1018,165 1043,165" marker-end="url(#arrowhead)"/>
    <path class="arrow" d="M990,220 C1020,220 1022,215 1047,215" marker-end="url(#arrowhead)"/>
    <path class="arrow dashed" d="M990,240 C1022,240 1026,308 1055,308" marker-end="url(#arrowhead)"/>

    <!-- MCP subscribe loop: agent hosts to the bridge -->
    <path class="arrow" d="M1110,38 V-57 Q1110,-65 1102,-65 H757" marker-end="url(#arrowhead)"/>
    <text class="label" x="935" y="-75" text-anchor="middle">MCP: events/subscribe, events/poll, get_event, …</text>

    <!-- Footer -->
    <text class="muted" x="600" y="420" font-size="13" text-anchor="middle">Agents subscribe over MCP; the bridge creates a connection per subscription, and Event Gateway delivers each event to the callback URL.</text>
    <text class="muted" x="600" y="440" font-size="13" text-anchor="middle">Events don't pass through the bridge, and it's stateless: subscriptions are Event Gateway connections. Dashed: other services and agents.</text>
  </g>
</svg>
