name: release

# Publishes to npm when a GitHub Release is published. Create the release with
# `gh release create` (see .claude/skills/mcp-events-bridge-release): it writes
# the notes and creates the tag in one step. A tag pushed by hand publishes nothing.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      # The version comes from the release PR, not from the tag: fail before
      # publishing if they differ, since npm never lets a version be reused.
      - name: Check the tag matches package.json
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG doesn't match package.json version $VERSION. Bump package.json in a release PR first."
            exit 1
          fi
          NPM_TAG=latest
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG=$(echo "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
          elif [ "$PRERELEASE" = "true" ]; then
            echo "::error::$TAG is marked pre-release but has no pre-release suffix (e.g. v0.3.0-beta.1)."
            exit 1
          fi
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with npm tag $NPM_TAG"

      - run: npm ci
      # prepublishOnly runs typecheck and tests; prepack builds dist/.
      - run: npm publish --provenance --access public --tag ${{ steps.version.outputs.npm_tag }}
    outputs:
      npm_tag: ${{ steps.version.outputs.npm_tag }}

  # Publishes server.json to the official MCP Registry as io.github.hookdeck/mcp-events-bridge.
  # GitHub OIDC grants io.github.hookdeck/* to workflows in hookdeck repositories, so no secret
  # is needed. Pre-releases are skipped: the registry treats the newest version as latest.
  publish-mcp-registry:
    needs: publish-npm
    if: needs.publish-npm.outputs.npm_tag == 'latest'
    runs-on: ubuntu-latest
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      # test/server-json.test.ts already checked that server.json names this version.
      - run: ./mcp-publisher validate

      # The registry checks that npm serves this version, and npm can take a few minutes
      # after `npm publish` succeeds (about 2 for 0.9.0, when publish failed with a 404).
      - name: Wait for npm to serve this version
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 40); do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "npm serves $NAME@$VERSION"
              exit 0
            fi
            echo "npm doesn't serve $NAME@$VERSION yet ($attempt/40); waiting 15s"
            sleep 15
          done
          echo "::error::npm still doesn't serve $NAME@$VERSION after 10 minutes. Re-run this job once it does."
          exit 1

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
